<style>
/* ============================================================
   EXECUTIVE SUITE — Meridian Dynamics internal systems
   Mobile-first enterprise UI. Light + dark, both selected.
   ============================================================ */

:root {
  color-scheme: light;

  /* surfaces & ink */
  --plane:        #f4f4f1;
  --surface:      #fcfcfb;
  --surface-2:    #f2f2ee;
  --surface-3:    #e9e9e3;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-3:        #898781;
  --hairline:     #e1e0d9;
  --border:       rgba(11, 11, 11, 0.10);
  --shadow:       0 1px 2px rgba(11,11,11,.05), 0 8px 24px -12px rgba(11,11,11,.18);
  --shadow-lift:  0 2px 4px rgba(11,11,11,.06), 0 18px 40px -16px rgba(11,11,11,.28);

  /* brand — Meridian Dynamics */
  --brand:        #2a78d6;
  --brand-ink:    #184f95;
  --brand-wash:   #eaf2fd;
  --brand-track:  #cde2fb;

  /* status (fixed, never themed) */
  --good:         #0ca30c;
  --warning:      #fab219;
  --serious:      #ec835a;
  --critical:     #d03b3b;
  --good-text:    #006300;
  --critical-text:#a52626;

  /* meter fills — severity ramp; amber darkened for the light surface
     so a 3px bar clears 3:1. Value is always printed above the bar,
     so hue is reinforcement, never the encoding. */
  --meter-warn:   #b07800;
  --track:        #e6e5df;

  --radius:       14px;
  --radius-sm:    10px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:       #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #232322;
    --surface-3:   #2c2c2a;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-3:       #898781;
    --hairline:    #2c2c2a;
    --border:      rgba(255, 255, 255, 0.10);
    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.8);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.9);
    --brand:       #3987e5;
    --brand-ink:   #86b6ef;
    --brand-wash:  #16243a;
    --brand-track: #184f95;
    --good-text:   #0ca30c;
    --critical-text:#e66767;
    --meter-warn:  #fab219;
    --track:       #333331;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:       #0d0d0d;
  --surface:     #1a1a19;
  --surface-2:   #232322;
  --surface-3:   #2c2c2a;
  --ink:         #ffffff;
  --ink-2:       #c3c2b7;
  --ink-3:       #898781;
  --hairline:    #2c2c2a;
  --border:      rgba(255, 255, 255, 0.10);
  --shadow:      0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.8);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.9);
  --brand:       #3987e5;
  --brand-ink:   #86b6ef;
  --brand-wash:  #16243a;
  --brand-track: #184f95;
  --good-text:   #0ca30c;
  --critical-text:#e66767;
  --meter-warn:  #fab219;
  --track:       #333331;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body { min-height: 100dvh; }

button { font: inherit; color: inherit; }

/* ---------- app frame ---------- */

.app {
  max-width: 540px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--plane);
  position: relative;
}

/* ---------- top chrome ---------- */

.header {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 6px 16px -14px rgba(0,0,0,.4);
}
.topbar {
  padding: max(env(safe-area-inset-top), 6px) 15px 0;
}

.brandrow {
  display: flex; align-items: center; gap: 8px;
  height: 42px;
}
.logomark {
  width: 22px; height: 22px; flex: none;
  display: block;
}
.brandname {
  font-size: 13px; font-weight: 650; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink);
}
.brandsub {
  font-size: 11px; color: var(--ink-3); letter-spacing: .01em;
  margin-left: auto; font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 7px;
}
.brandsub .tick { color: var(--ink-2); font-weight: 600; }
.iconbtn {
  margin-left: 10px;
  width: 30px; height: 30px; flex: none;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-2);
  display: grid; place-items: center;
  cursor: pointer; padding: 0;
}
.iconbtn:active { background: var(--surface-3); }

.contextrow {
  display: flex; align-items: center; gap: 6px;
  padding-bottom: 9px; flex-wrap: wrap;
}
.role {
  font-size: 14.5px; font-weight: 640; letter-spacing: -.01em;
  line-height: 1.25;
}
.roleline { flex: 1 1 100%; }
.roleline .dept { font-size: 12px; color: var(--ink-3); font-weight: 450; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.chip.q { font-variant-numeric: tabular-nums; }

/* ---------- stat rail ---------- */

.rail {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--hairline);
  border-top: 1px solid var(--hairline);
}
.stat {
  background: var(--surface);
  padding: 7px 10px 8px;
  min-width: 0;
}
.stat .lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .val {
  font-size: 16px; font-weight: 670; letter-spacing: -.02em;
  line-height: 1.15; margin-top: 0px;
}
.stat .val .delta {
  font-size: 11px; font-weight: 620; margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
.delta.up   { color: var(--good-text); }
.delta.down { color: var(--critical-text); }

.meter {
  height: 3px; border-radius: 999px;
  background: var(--track);
  margin-top: 5px; overflow: hidden;
}
.meter > i {
  display: block; height: 100%; border-radius: 999px;
  transition: width .5s cubic-bezier(.22,1,.36,1);
}

/* ---------- main scroll region ---------- */

.main {
  flex: 1 1 auto;
  padding: 14px 14px calc(88px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
}

/* ---------- cards ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: rise .34s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .toast { animation: none !important; }
  .meter > i { transition: none; }
}

.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--hairline);
}
.card-head .avatar { flex: none; }
.card-head .who { min-width: 0; flex: 1; }
.card-head .who .n {
  font-size: 14px; font-weight: 640; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-head .who .t {
  font-size: 11.5px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kind {
  font-size: 9.5px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 2px 6px; flex: none;
}
.kind.urgent { color: var(--critical-text); border-color: var(--critical); }
.kind.board  { color: var(--brand-ink); border-color: var(--brand); }

.card-body { padding: 14px; }
.subject {
  font-size: 17px; font-weight: 660; letter-spacing: -.015em;
  line-height: 1.3; margin: 0 0 8px;
}
.body-text { font-size: 15px; color: var(--ink-2); margin: 0; }
.body-text p { margin: 0 0 11px; }
.body-text p:last-child { margin-bottom: 0; }
.body-text em { color: var(--ink); font-style: italic; }
.body-text strong { color: var(--ink); font-weight: 640; }

.quote {
  border-left: 3px solid var(--brand-track);
  padding: 2px 0 2px 12px;
  margin: 0 0 11px;
  color: var(--ink-2); font-size: 14.5px;
}

/* ---------- choices ---------- */

.choices { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
.choice {
  display: block; width: 100%; text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 13px;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
  min-height: 48px;
}
.choice:active { transform: scale(.985); background: var(--surface-3); }
@media (hover: hover) {
  .choice:hover { border-color: var(--brand); background: var(--brand-wash); }
}
.choice .ct { font-size: 14.5px; font-weight: 560; line-height: 1.4; }
.choice .cd {
  font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.4;
}
.choice .lock {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--brand-ink);
  background: var(--brand-wash); border: 1px solid var(--brand-track);
  border-radius: 5px; padding: 1px 6px; margin-bottom: 6px;
}
.choice[disabled] { opacity: .45; cursor: default; }
.choice[disabled]:active { transform: none; }

/* ---------- primary button ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: var(--brand); color: #fff;
  font-size: 15.5px; font-weight: 620; letter-spacing: -.005em;
  cursor: pointer;
  transition: transform .12s ease, filter .15s ease;
}
.btn:active { transform: scale(.985); filter: brightness(.94); }
.btn.ghost {
  background: var(--surface); color: var(--ink);
  border-color: var(--border);
}
.btn.ghost:active { background: var(--surface-2); }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* ---------- outcome / consequence ---------- */

.outcome .card-body { padding-top: 14px; }
.fxlist {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 0 14px 14px;
}
.fx {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
  animation: pop .3s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pop { from { opacity:0; transform: translateY(4px) scale(.94);} to {opacity:1; transform:none;} }
.fx.pos { color: var(--good-text); }
.fx.neg { color: var(--critical-text); }
.fx .fxdot { width: 6px; height: 6px; border-radius: 50%; }

/* ---------- allocation ---------- */

.alloc-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 0 14px 10px;
}
.alloc-head .rem {
  font-size: 13px; font-weight: 620; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.alloc-head .rem b { color: var(--brand); font-size: 17px; }
.track-row {
  padding: 11px 14px;
  border-top: 1px solid var(--hairline);
}
.track-row .tr-top {
  display: flex; align-items: center; gap: 10px;
}
.track-row .tr-name { font-size: 14.5px; font-weight: 600; flex: 1; min-width: 0; }
.track-row .tr-desc { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.35; }
.stepper {
  display: flex; align-items: center; gap: 2px; flex: none;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 2px;
}
.stepper button {
  width: 34px; height: 34px; border: 0; background: transparent;
  border-radius: 7px; font-size: 20px; font-weight: 500; line-height: 1;
  cursor: pointer; display: grid; place-items: center;
  color: var(--ink);
}
.stepper button:active { background: var(--surface-3); }
.stepper button[disabled] { opacity: .3; cursor: default; }
.stepper .n {
  min-width: 26px; text-align: center;
  font-size: 16px; font-weight: 680; font-variant-numeric: tabular-nums;
}
.pips { display: flex; gap: 3px; margin-top: 8px; }
.pips i {
  height: 4px; flex: 1; border-radius: 999px; background: var(--track);
  transition: background .25s ease;
}
.pips i.on { background: var(--brand); }

/* ---------- review ---------- */

.scorebar {
  padding: 14px; border-top: 1px solid var(--hairline);
}
.scorebar .sb-top {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 8px;
}
.scorebar .sb-lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.scorebar .sb-val { font-size: 26px; font-weight: 680; letter-spacing: -.03em; }
.gauge {
  position: relative; height: 10px; border-radius: 999px;
  background: var(--track); overflow: visible;
}
.gauge > .fill {
  height: 100%; border-radius: 999px;
  transition: width .8s cubic-bezier(.22,1,.36,1);
}
.gauge > .bar {
  position: absolute; top: -4px; bottom: -4px; width: 2px;
  background: var(--ink); border-radius: 1px;
}
.gauge > .bar::after {
  content: attr(data-label);
  position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink-2); white-space: nowrap;
}
.gauge-legend {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--ink-3); margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

.verdict {
  text-align: center; padding: 22px 16px 18px;
}
.verdict .vk {
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3);
}
.verdict .vt {
  font-size: 27px; font-weight: 700; letter-spacing: -.03em;
  line-height: 1.15; margin: 6px 0 8px;
}
.verdict .vs { font-size: 14.5px; color: var(--ink-2); max-width: 34ch; margin: 0 auto; }
.verdict.good .vt { color: var(--good-text); }
.verdict.bad  .vt { color: var(--critical-text); }

.linelist { padding: 0 14px 6px; }
.lineitem {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 0; border-top: 1px solid var(--hairline);
  font-size: 13.5px;
}
.lineitem:first-child { border-top: 0; }
.lineitem .li-k { flex: 1; color: var(--ink-2); }
.lineitem .li-v { font-weight: 620; font-variant-numeric: tabular-nums; flex: none; }
.lineitem .li-icon { flex: none; margin-top: 2px; }

/* ---------- people ---------- */

.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 680; letter-spacing: .01em;
  color: #fff; position: relative;
}
.avatar.sm { width: 30px; height: 30px; font-size: 11px; }
.avatar .ring {
  position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid transparent;
}

.person {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-top: 1px solid var(--hairline);
}
.person:first-child { border-top: 0; }
.person .pinfo { flex: 1; min-width: 0; }
.person .pname { font-size: 14.5px; font-weight: 620; }
.person .ptitle { font-size: 11.5px; color: var(--ink-3); }
.person .pstand { flex: none; text-align: right; }
.person .pstand .pl {
  font-size: 11px; font-weight: 660; letter-spacing: .01em;
}
.person .pstand .pmeter {
  width: 54px; height: 4px; border-radius: 999px;
  background: var(--track); margin-top: 5px; overflow: hidden;
  margin-left: auto;
}
.person .pstand .pmeter > i { display: block; height: 100%; border-radius: 999px; }

/* ---------- sparkline / company ---------- */

.viz { padding: 14px; }
.viz-title {
  font-size: 13px; font-weight: 620; letter-spacing: -.005em;
}
.viz-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.hero {
  font-size: 30px; font-weight: 680; letter-spacing: -.03em; line-height: 1.1;
  margin-top: 10px;
}
.hero .hd { font-size: 13px; font-weight: 620; margin-left: 6px; }
svg.spark { display: block; width: 100%; height: 74px; margin-top: 8px; overflow: visible; }

.tablink {
  display: block; width: 100%; text-align: left;
  background: none; border: 0; padding: 0; cursor: pointer;
}

/* ---------- section label ---------- */

.seclabel {
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 2px 2px 0;
}

/* ---------- bottom nav ---------- */

.nav {
  position: sticky; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--hairline);
  padding-bottom: env(safe-area-inset-bottom);
}
.navbtn {
  border: 0; background: none; cursor: pointer;
  padding: 8px 0 9px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-3);
  position: relative;
}
.navbtn .nl { font-size: 10px; font-weight: 620; letter-spacing: .01em; }
.navbtn.on { color: var(--brand); }
.navbtn .badge {
  position: absolute; top: 5px; left: 50%; margin-left: 5px;
  min-width: 15px; height: 15px; border-radius: 999px;
  background: var(--critical); color: #fff;
  font-size: 9.5px; font-weight: 700; line-height: 15px; text-align: center;
  padding: 0 4px;
}

/* ---------- title screen ---------- */

.title-wrap {
  flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
  padding: max(calc(env(safe-area-inset-top) + 22px), 5vh) 22px calc(28px + env(safe-area-inset-bottom));
  gap: 15px;
  min-height: 100dvh;
}
.title-mark { width: 46px; height: 46px; }
.title-h {
  font-size: 31px; font-weight: 700; letter-spacing: -.035em; line-height: 1.06;
}

        fx: { cred: 4, cap: -1, perf: 1, burn: 2 }, rel: { tom: 6 },
        need: { stat: ['cap', 40] },
        result: 'It works because your chief of staff is good and because you have enough standing that sending a proxy reads as confidence rather than absence. Both of those are things you spent years acquiring.' },
    ],
  },
  {
    id: 'x_routine3', repeat: true, from: 'dana', channel: 'meeting',
    subject: 'Someone above you is wrong in a meeting',
    body: [
      'The assertion is about your business and it is incorrect, and it is being used to support a decision that will cost about $8M.',
      'There are fourteen people in the room, four of them more senior than you.',
    ],
    choices: [
      { text: 'Correct it, in the room, immediately',
        fx: { cred: 7, cap: -3, perf: 3, integ: 4 },
        result: 'You do it in two sentences without any of the softening language, and the decision changes, and the person who was wrong is gracious in public and something else in private.' },
      { text: 'Let it go and fix it afterwards by email',
        fx: { cap: 2, cred: 1, perf: 1 },
        result: 'The email is careful and effective and the decision is quietly revised the following week, and nobody in that room of fourteen learns that you were the one who caught it.' },
      { text: 'Say nothing',
        fx: { cap: 1, cred: -4, integ: -3 },
        result: 'The decision proceeds. It costs about what you thought it would cost, and it is absorbed into a variance line eleven months later with no name attached to it, including yours.' },

/* ---------- state ---------- */

function diffOf(s) {
  return DIFFICULTIES.find((d) => d.id === (s && s.diff)) || DIFFICULTIES[0];
}
function focusPoints(s) { return diffOf(s).focus; }

/* Backgrounds override the first rungs only — every path converges on
   Senior Director, Business Operations. Keeps 50 scenarios coherent. */
function roleAt(s, rank) {
  const R = RANKS[rank];
  const bg = BACKGROUNDS.find((b) => b.id === (s && s.bg));
  const ov = (bg && bg.entry && bg.entry[rank]) || null;
  return {
    title: (ov && ov.title) || R.title,
    dept: (ov && ov.dept) || R.dept,
    short: (ov && ov.short) || R.short,
    intro: (ov && ov.intro) || R.intro,
  };
}
function role(s) { return roleAt(s, s.rank); }

function newGame(name, bgId, seed, diffId) {
  const bg = BACKGROUNDS.find((b) => b.id === bgId) || BACKGROUNDS[0];
  const dif = DIFFICULTIES.find((d) => d.id === diffId) || DIFFICULTIES[0];
  const rel = {};
  for (const k of PEOPLE_ORDER) rel[k] = PEOPLE[k].start + (bg.rel[k] || 0);

  const s = {
    name: name || 'You',
    bg: bg.id,
    diff: dif.id,
    seed: seed >>> 0,
    rs: seed >>> 0,

    rank: 0,
    qAtRank: 0,
    quarter: 0,
    year: 2026,
    qLabel: 1,

    perf: bg.stats.perf,
    cap: bg.stats.cap,
    cred: bg.stats.cred,
    integ: bg.stats.integ,
    burn: 12,

    salary: RANKS[0].base,
    cash: bg.startCash || 0,
    cash0: bg.startCash || 0,
    units: 0,
    stock: 74.0,
    stock0: 74.0,

    market: dif.startMarket,
    rel,
    assets: {},
    flags: {},
    seen: {},
    queue: [],
    strikes: 0,
    history: [],
    feed: [],

    phase: 'brief',
    scenIdx: 0,
    scenPerQuarter: 2,
    pending: null,
    lastAlloc: null,
    lastReview: null,
    endgameIdx: 0,
    over: null,
    ending: null,
  };
  s.history.push({ q: 0, stock: s.stock, score: null, label: 'Start' });
  return s;
}

function rng(s) {
  s.rs = (s.rs + 0x6D2B79F5) | 0;
  let t = s.rs;
  t = Math.imul(t ^ (t >>> 15), 1 | t);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss(s) { return (rng(s) + rng(s) + rng(s) - 1.5) / 1.5; }

/* ---------- helpers ---------- */

function boss(s) { return RANKS[s.rank].boss; }

function standingOf(v) {
  for (const t of STANDING) if (v < t.at) return t;
  return STANDING[STANDING.length - 1];
}

function has(s, asset) { return !!s.assets[asset]; }

function targetComp(s) {
  const R = RANKS[s.rank];
  return Math.round(s.salary * (1 + R.bonusTarget) + R.lti);
}
function equityValue(s) { return Math.round(s.units * s.stock); }
function totalEarned(s) { return Math.round(s.cash - (s.cash0 || 0) + s.units * s.stock); }
function saleProceeds(s) { return Math.round(s.cash0 || 0); }

function bossScore(s) {
  return clamp((s.rel[boss(s)] + 100) / 2, 0, 100);
}

function reviewScore(s) {
  const burnPenalty = Math.max(0, s.burn - 58) * 0.42;
  const raw = 0.42 * s.perf + 0.24 * s.cap + 0.20 * s.cred + 0.14 * bossScore(s) - burnPenalty;
  return clamp(round1(raw), 0, 100);
}

function reviewBar(s) {
  return RANKS[s.rank].bar + MARKET[s.market].barAdj + diffOf(s).barAdj;
}

/* ---------- quarter start ---------- */

function startQuarter(s) {
  if (s.quarter > 0) {
    // market transition
    const flow = MARKET_FLOW[s.market];
    let total = flow.reduce((a, f) => a + f[1], 0);
    let roll = rng(s) * total;
    for (const [st, w] of flow) { roll -= w; if (roll <= 0) { s.market = st; break; } }

    // natural decay
    const dAdj = diffOf(s).decayAdj;
    s.perf = clamp(s.perf - TUNE.decayPerf - dAdj, 0, 100);
    s.cap = clamp(s.cap - TUNE.decayCap - dAdj * 0.5, 0, 100);
    s.cred = clamp(s.cred - TUNE.decayCred, 0, 100);
    s.burn = clamp(s.burn + TUNE.baseBurn + s.rank * TUNE.rankBurn, 0, 100);
    for (const k of PEOPLE_ORDER) s.rel[k] = round1(s.rel[k] * 0.97);
    normalize(s);
  }

  // stock move
  const m = MARKET[s.market];
  const move = (m.drift + gauss(s) * m.vol) / 100;
  s.stock = Math.max(4, round1(s.stock * (1 + move)));

  s.quarter += 1;
  s.qAtRank += 1;
  s.qLabel = ((s.quarter - 1) % 4) + 1;
  s.year = 2026 + Math.floor((s.quarter - 1) / 4);

  // base salary is banked quarterly; the annual LTI grant is delivered in
  // shares bought at the price on the day, so a bad year buys you more of them
  const RK = RANKS[s.rank];
  s.cash += s.salary / 4;
  if (RK.lti > 0) s.units = Math.round((s.units + (RK.lti / 4) / s.stock) * 100) / 100;

  s.phase = 'alloc';
  s.scenIdx = 0;
  s.pending = null;
  s.save = saveCode(s);
  return {
    market: s.market,
    memo: m.memo,
    stock: s.stock,
  };
}

/* ---------- allocation ---------- */

function applyAlloc(s, alloc) {
  const scale = 1 - s.rank * 0.028;
  const before = snapshot(s);

  const e = alloc.execution || 0;
  const r = alloc.relationships || 0;
  const v = alloc.visibility || 0;
  const c = alloc.recovery || 0;

  s.perf += e * TUNE.exec * scale;
  s.burn += e * TUNE.execBurn;

  s.cap += r * TUNE.relCap * scale;
  s.burn += r * TUNE.relBurn;
  const b = boss(s);
  s.rel[b] += r * TUNE.relBoss;
  // one other relationship, weighted toward whoever is lowest
  if (r > 0) {
    const others = PEOPLE_ORDER.filter((k) => k !== b);
    const pick = others[Math.floor(rng(s) * others.length)];
    s.rel[pick] += r * 1.0;
  }

  s.cap += v * TUNE.visCap * scale;
  s.perf += v * TUNE.visPerf * scale;
  s.cred += v * (s.perf > 62 ? 0.3 : -0.55);
  s.rel.voss += v * 0.55;
  s.burn += v * TUNE.visBurn;

  s.burn -= c * TUNE.recBurn;
  s.perf -= c * TUNE.recPerf;
  s.cap -= c * TUNE.recCap;

  normalize(s);
  s.lastAlloc = alloc;
  s.phase = 'scen';
  return diff(before, s);
}

function snapshot(s) {
  return { perf: s.perf, cap: s.cap, cred: s.cred, burn: s.burn, integ: s.integ, cash: s.cash, stock: s.stock };
}
function diff(a, s) {
  const d = {};
  for (const k of Object.keys(a)) {
    const delta = Math.round(s[k] - a[k]);
    if (delta !== 0) d[k] = delta;
  }
  return d;
}
function normalize(s) {
  for (const k of ['perf', 'cap', 'cred', 'integ', 'burn']) s[k] = clamp(round1(s[k]), 0, 100);
  for (const k of PEOPLE_ORDER) s.rel[k] = clamp(round1(s.rel[k]), -100, 100);
}

/* ---------- scenario selection ---------- */

Object.assign(CONSEQUENCES, CONSEQUENCES_C);
const ALL_SCENARIOS = [].concat(SCENARIOS_A, SCENARIOS_B, SCENARIOS_C);

function needMet(s, need) {
  if (!need) return true;
  if (need.asset) return has(s, need.asset);
  if (need.stat) return s[need.stat[0]] >= need.stat[1];
  if (need.rel) return s.rel[need.rel[0]] >= need.rel[1];
  if (need.flag) return !!s.flags[need.flag];
  return true;
}

function drawScenario(s) {
  // 1. due consequence
  const dueIdx = s.queue.findIndex((q) => q.at <= s.quarter);
  if (dueIdx >= 0) {
    const q = s.queue.splice(dueIdx, 1)[0];
    const c = CONSEQUENCES[q.id];
    if (c) return Object.assign({ id: q.id, isConsequence: true }, c);
  }

  // 2. eligible pool
  const pool = [];
  for (const sc of ALL_SCENARIOS) {
    if (s.seen[sc.id]) continue;
    if (s.rank < sc.tier[0] || s.rank > sc.tier[1]) continue;
    if (sc.market && sc.market.indexOf(s.market) < 0) continue;
    if (sc.requires && !sc.requires(s)) continue;
    pool.push(sc);
  }
  if (pool.length) {
    let total = pool.reduce((a, p) => a + (p.weight || 1), 0);
    let roll = rng(s) * total;
    for (const p of pool) { roll -= (p.weight || 1); if (roll <= 0) return p; }
    return pool[pool.length - 1];
  }

  // 3. filler
  const f = FILLERS[Math.floor(rng(s) * FILLERS.length)];
  return Object.assign({}, f, { id: f.id + '_' + s.quarter, baseId: f.id });
}

function nextScenario(s) {
  const sc = drawScenario(s);
  s.pending = sc;
  return sc;
}

/* ---------- applying a choice ---------- */

function applyChoice(s, sc, idx) {
  const before = snapshot(s);
  const relBefore = Object.assign({}, s.rel);
  const ch = (sc.choices && sc.choices[idx]) || null;

  const fx = ch ? ch.fx : sc.fx;
  const rel = ch ? ch.rel : sc.rel;
  const gain = ch ? ch.gain : sc.gain;
  const flag = ch ? ch.flag : sc.flag;
  const queue = ch ? ch.queue : sc.queue;
  const spend = ch ? ch.spend : null;
  const result = ch ? ch.result : sc.result;

  if (fx) {
    for (const k of ['perf', 'cap', 'cred', 'burn', 'integ']) if (fx[k]) s[k] += fx[k];
    if (fx.cash) s.cash += fx.cash;
    if (fx.stock) s.stock = Math.max(4, round1(s.stock * (1 + fx.stock / 100)));
  }
  if (rel) for (const k of Object.keys(rel)) if (s.rel[k] !== undefined) s.rel[k] += rel[k];
  if (gain) s.assets[gain] = true;
  if (spend) delete s.assets[spend];
  if (flag) s.flags[flag] = true;
  if (queue) {
    const [id, lo, hi] = queue;
    const at = s.quarter + lo + Math.floor(rng(s) * Math.max(1, hi - lo + 1));
    s.queue.push({ id, at });
  }

  if (ch && ch.end) { s.over = ch.end; }
  if (!sc.repeat) s.seen[sc.id] = true;
  normalize(s);

  const relDelta = {};
  for (const k of PEOPLE_ORDER) {
    const d = Math.round(s.rel[k] - relBefore[k]);
    if (d !== 0) relDelta[k] = d;
  }

  const ni = NODE_INDEX[sc.baseId || sc.id];
  if (ni !== undefined) s.feed.push({ q: s.quarter, ni: ni, ci: ch ? idx : -1 });
  s.scenIdx += 1;
  s.phase = s.over ? 'ending' : (s.scenIdx >= s.scenPerQuarter ? 'review' : 'scen');
  s.pending = null;

  return { result, fx: diff(before, s), rel: relDelta, gain, spend };
}

/* ---------- review ---------- */

function runReview(s) {
  const score = reviewScore(s);
  const bar = reviewBar(s);
  const R = RANKS[s.rank];

  // annual incentive: target is a percentage of base, paid on a 0-200%
  // curve centred on the promotion bar, accrued a quarter at a time
  const payout = clamp((score - (bar - 25)) / 25, 0, 2);
  const bonus = Math.round((s.salary * R.bonusTarget / 4) * payout);
  s.cash += bonus;

  let verdict, note;

  if (s.burn >= 100) {
    verdict = 'burnout';
    note = 'You are not able to continue at this pace.';
  } else if (score >= bar && s.qAtRank >= R.minQ) {
    verdict = s.rank === 5 ? 'slate' : 'promote';
  } else if (s.qAtRank >= R.maxQ) {
    verdict = s.rank >= 4 ? 'stall' : 'out';
    note = 'The role has been reposted at your level.';
  } else if (score >= bar - TUNE.holdBand && s.qAtRank < R.maxQ - 1) {
    verdict = 'hold';
    note = 'Solid quarter. Not yet a step up.';
  } else if (score >= bar - TUNE.warnBand) {
    verdict = 'warn';
    s.strikes += 1;
    note = 'A documented conversation about trajectory.';
  } else {
    verdict = 'warn';
    s.strikes += 2;
    note = 'A formal performance conversation, with a plan attached.';
  }

  if (s.strikes >= 3 && verdict !== 'burnout') { verdict = 'out'; }

  s.history.push({ q: s.quarter, stock: s.stock, score, label: `Q${s.qLabel} ${s.year}` });

  const detail = {
    score, bar, bonus, verdict, note, payout,
    parts: [
      { k: 'Performance', v: Math.round(s.perf), w: 0.42 },
      { k: 'Political capital', v: Math.round(s.cap), w: 0.24 },
      { k: 'Credibility', v: Math.round(s.cred), w: 0.20 },
      { k: `${PEOPLE[boss(s)].name.split(' ')[0]}'s view`, v: Math.round(bossScore(s)), w: 0.14 },
    ],
    burnPenalty: Math.round(Math.max(0, s.burn - 58) * 0.42),
  };

  s.lastReview = detail;

  if (verdict === 'burnout') { s.over = 'burnout'; s.phase = 'ending'; }
  else if (verdict === 'out') { s.over = 'fired'; s.phase = 'ending'; }
  else if (verdict === 'stall') { s.over = 'stalled'; s.phase = 'ending'; }
  else if (verdict === 'promote') { s.phase = 'promote'; }
  else if (verdict === 'slate') { s.phase = 'endgame'; s.endgameIdx = 0; }
  else { s.phase = 'nextq'; }

  return detail;
}

function promote(s) {
  s.rank += 1;
  s.qAtRank = 0;
  s.strikes = Math.max(0, s.strikes - 1);
  const R = RANKS[s.rank];
  s.salary = R.base;
  if (R.promoGrant > 0) s.units = Math.round((s.units + R.promoGrant / s.stock) * 100) / 100;
  s.burn = clamp(s.burn - 6, 0, 100);
  s.cap = clamp(s.cap + 4, 0, 100);
  s.phase = 'nextq';
  return R;
}

/* ---------- endgame ---------- */

function endgameBeat(s) {
  return ENDGAME[s.endgameIdx] || null;
}

function applyEndgameChoice(s, idx) {
  const beat = ENDGAME[s.endgameIdx];
  const out = applyChoice(s, Object.assign({}, beat, { repeat: true }), idx);
  s.endgameIdx += 1;
  s.phase = s.endgameIdx >= ENDGAME.length ? 'vote' : 'endgame';
  s.scenIdx = 0;
  return out;
}

function finalVote(s) {
  const vossN = clamp((s.rel.voss + 100) / 2, 0, 100);
  let v = 0.28 * s.cred + 0.20 * s.cap + 0.16 * s.perf + 0.26 * vossN + 0.10 * s.integ;
  if (s.flags.campaigned) v -= 8;
  if (s.flags.mutual_destruction) v -= 18;
  if (s.flags.public_scandal) v -= 30;
  if (s.flags.sec_matter) v -= 14;
  if (s.flags.retaliation_finding) v -= 20;
  if (s.flags.sarter_burn) v -= 12;
  if (s.flags.renn_knows) v -= 6;
  if (has(s, 'sponsor')) v += 5;
  if (has(s, 'floor')) v += 3;
  if (has(s, 'candor')) v += 3;
  if (s.rel.marcus > 40) v += 3;

  v = round1(v);
  const voteBar = TUNE.voteBar + diffOf(s).voteAdj;
  const passed = v >= voteBar;
  if (passed) { s.rank = 6; s.salary = RANKS[6].base; s.units = Math.round((s.units + RANKS[6].promoGrant / s.stock) * 100) / 100; s.over = 'ceo'; }
  else s.over = 'passed';
  s.phase = 'ending';
  return { v, bar: voteBar, passed };
}

/* ---------- endings ---------- */

function pickEnding(s) {
  for (const e of ENDINGS) {
    try { if (e.test(s)) { s.ending = e.id; return e; } } catch (err) { /* skip */ }
  }
  s.ending = ENDINGS[ENDINGS.length - 1].id;
  return ENDINGS[ENDINGS.length - 1];
}


/* ============================================================
   SAVE CODEC
   A code is captured at the start of every quarter, so restoring
   never lands mid-decision and nothing can be double-applied.
   ============================================================ */

const NODE_LIST = [];
const NODE_INDEX = {};
const NODE_BY_ID = {};
(function buildNodeIndex() {
  const add = (id, obj) => {
    if (NODE_INDEX[id] === undefined) { NODE_INDEX[id] = NODE_LIST.length; NODE_LIST.push(id); }
    NODE_BY_ID[id] = obj;
  };
  for (const x of ALL_SCENARIOS) add(x.id, x);
  for (const x of FILLERS) add(x.id, x);
  for (const x of ENDGAME) add(x.id, x);
  for (const k of Object.keys(CONSEQUENCES)) add(k, Object.assign({ id: k }, CONSEQUENCES[k]));
})();

const ASSET_IDS = Object.keys(ASSETS);
const CONSEQ_IDS = Object.keys(CONSEQUENCES);

/* every flag any piece of content can set, in a stable order */
const FLAG_IDS = (function collectFlags() {
  const seen = {};
  const eat = (o) => { if (o && o.flag) seen[o.flag] = 1; };
  for (const x of ALL_SCENARIOS.concat(FILLERS, ENDGAME)) {
    eat(x); for (const c of (x.choices || [])) eat(c);
  }
  for (const k of Object.keys(CONSEQUENCES)) {
    const c = CONSEQUENCES[k]; eat(c);
    for (const ch of (c.choices || [])) eat(ch);
  }
  return Object.keys(seen).sort();
})();

/* content fingerprint — a code from a different build must not
   silently decode against a shifted index table */
const CONTENT_HASH = (function hash() {
  /* the ruleset is part of the fingerprint: a code written under different
     pacing or difficulty rules would restore into a game it cannot describe */
  const ruleset = RANKS.map((r) => [r.bar, r.minQ, r.maxQ, r.base].join(',')).join(';')
    + '#' + DIFFICULTIES.map((d) => [d.id, d.barAdj, d.focus, d.voteAdj].join(',')).join(';')
    + '#' + BACKGROUNDS.map((b) => [b.id, b.stats.perf, b.stats.cap, b.stats.cred, b.stats.integ].join(',')).join(';');
  const str = NODE_LIST.join('|') + '#' + FLAG_IDS.join('|') + '#' + ASSET_IDS.join('|') + '#' + ruleset;
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
})();

const _B64 = (typeof btoa === 'function')
  ? { e: (b) => btoa(b), d: (c) => atob(c) }
  : { e: (b) => Buffer.from(b, 'binary').toString('base64'),
      d: (c) => Buffer.from(c, 'base64').toString('binary') };

function b64u(str) {
  const bin = unescape(encodeURIComponent(str));
  return _B64.e(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(code) {
  let c = String(code).trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (c.length % 4) c += '=';
  return decodeURIComponent(escape(_B64.d(c)));
}

function quarterLabel(q) {
  if (q <= 0) return 'Start';
  return 'Q' + (((q - 1) % 4) + 1) + ' ' + (2026 + Math.floor((q - 1) / 4));
}

function saveCode(s) {
  const o = {
    v: 1, c: CONTENT_HASH,
    n: s.name, b: s.bg, d: s.diff, rs: s.rs | 0,
    r: s.rank, qr: s.qAtRank, q: s.quarter, k: s.strikes,
    p: [s.perf, s.cap, s.cred, s.integ, s.burn].map((x) => Math.round(x * 10) / 10),
    sy: s.salary, cs: Math.round(s.cash), c0: Math.round(s.cash0 || 0), u: Math.round(s.units * 100) / 100,
    st: Math.round(s.stock * 100) / 100, s0: s.stock0,
    m: s.market,
    rl: PEOPLE_ORDER.map((k) => Math.round(s.rel[k] * 10)),
    as: Object.keys(s.assets).map((k) => ASSET_IDS.indexOf(k)).filter((i) => i >= 0),
    fl: Object.keys(s.flags).map((f) => { const i = FLAG_IDS.indexOf(f); return i >= 0 ? i : f; }),
    se: Object.keys(s.seen).map((k) => NODE_INDEX[k]).filter((i) => i !== undefined),
    qu: s.queue.map((x) => [CONSEQ_IDS.indexOf(x.id), x.at]).filter((x) => x[0] >= 0),
    h: s.history.map((x) => [x.q, x.stock, x.score === null ? -1 : x.score]),
    f: s.feed.map((x) => [x.q, x.ni, x.ci]),

  return b64u(JSON.stringify(o));
}

function loadCode(code) {
  let o;
  try { o = JSON.parse(unb64u(code)); } catch (e) { return null; }
  if (!o || o.v !== 1) return null;
  if (o.c !== CONTENT_HASH) return 'STALE';
  if (typeof o.r !== 'number' || o.r < 0 || o.r > 6) return null;
  if (!Array.isArray(o.p) || o.p.length !== 5) return null;
  if (!Array.isArray(o.rl) || o.rl.length !== PEOPLE_ORDER.length) return null;
  if (!MARKET[o.m]) return null;
  if (typeof o.q !== 'number' || o.q < 1) return null;

  try {
    const s = newGame(o.n || 'You', o.b || 'acquihire', 1, o.d || 'standard');
    s.rs = o.rs | 0;
    s.rank = o.r; s.qAtRank = o.qr || 1; s.quarter = o.q; s.strikes = o.k || 0;
    s.perf = o.p[0]; s.cap = o.p[1]; s.cred = o.p[2]; s.integ = o.p[3]; s.burn = o.p[4];
    s.salary = o.sy; s.cash = o.cs; s.cash0 = o.c0 || 0; s.units = o.u;
    s.stock = o.st; s.stock0 = o.s0; s.market = o.m;
    PEOPLE_ORDER.forEach((k, i) => { s.rel[k] = o.rl[i] / 10; });
    s.assets = {}; for (const i of (o.as || [])) if (ASSET_IDS[i]) s.assets[ASSET_IDS[i]] = true;
    s.flags = {};
    for (const f of (o.fl || [])) {
      const name = typeof f === 'number' ? FLAG_IDS[f] : f;
      if (name) s.flags[name] = true;
    }
    s.seen = {}; for (const i of (o.se || [])) if (NODE_LIST[i]) s.seen[NODE_LIST[i]] = true;
    s.queue = (o.qu || []).map((x) => ({ id: CONSEQ_IDS[x[0]], at: x[1] })).filter((x) => !!x.id);
    s.history = (o.h || []).map((x) => ({ q: x[0], stock: x[1], score: x[2] < 0 ? null : x[2], label: quarterLabel(x[0]) }));
    s.feed = (o.f || []).map((x) => ({ q: x[0], ni: x[1], ci: x[2] }));
    s.qLabel = ((o.q - 1) % 4) + 1;
    s.year = 2026 + Math.floor((o.q - 1) / 4);
    s.phase = 'brief'; s.scenIdx = 0; s.pending = null;
    s.over = null; s.ending = null; s.endgameIdx = 0; s.lastReview = null;
    normalize(s);
    s.save = saveCode(s);
    return s;
  } catch (e) { return null; }
}

function money(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n < 0 ? '-' : '') + '$' + (a / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'K';
  return (n < 0 ? '-' : '') + '$' + Math.round(a);
}

function statusHue(v, invert) {
  const x = invert ? 100 - v : v;
  if (x >= 66) return 'var(--good)';
  if (x >= 46) return 'var(--brand)';
  if (x >= 28) return 'var(--meter-warn)';
  return 'var(--critical)';
}

/* ---------- sparkline (single series → no legend) ---------- */

function sparkline(points) {
  const w = 300, h = 74, pad = 6;
  if (points.length < 2) return '';
  const vals = points.map((p) => p.stock);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi - lo < 0.5) { hi += 1; lo -= 1; }
  const x = (i) => pad + (i * (w - pad * 2)) / (points.length - 1);
  const y = (v) => h - pad - ((v - lo) / (hi - lo)) * (h - pad * 2);
  let d = '';
  points.forEach((p, i) => { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.stock).toFixed(1) + ' '; });
  const lastX = x(points.length - 1), lastY = y(points[points.length - 1].stock);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
      aria-label="Meridian Dynamics share price over ${points.length} quarters, currently $${points[points.length - 1].stock.toFixed(2)}">
    <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

/* ---------- desk: the active card ---------- */

function fxChips(fx, rel, gain, spend) {
  const names = {
    perf: 'Performance', cap: 'Capital', cred: 'Credibility',
    burn: 'Burnout', integ: '', cash: 'Cash', stock: 'MDY',
  };
  const out = [];
  for (const k of ['perf', 'cap', 'cred', 'burn']) {
    if (fx && fx[k]) {
      const good = k === 'burn' ? fx[k] < 0 : fx[k] > 0;
      out.push(`<span class="fx ${good ? 'pos' : 'neg'}">${names[k]} ${fx[k] > 0 ? '+' : ''}${fx[k]}</span>`);
    }
  }
  if (fx && fx.cash) out.push(`<span class="fx ${fx.cash > 0 ? 'pos' : 'neg'}">${money(fx.cash)}</span>`);
  if (fx && fx.stock) out.push(`<span class="fx ${fx.stock > 0 ? 'pos' : 'neg'}">MDY ${fx.stock > 0 ? '+' : ''}$${fx.stock}</span>`);
  if (rel) for (const k of Object.keys(rel)) {
    const p = PEOPLE[k];
    out.push(`<span class="fx ${rel[k] > 0 ? 'pos' : 'neg'}"><span class="fxdot" style="background:hsl(${p.hue} 42% 45%)"></span>${p.name.split(' ')[0]} ${rel[k] > 0 ? '+' : ''}${rel[k]}</span>`);
  }
  if (gain) out.push(`<span class="fx pos">Gained · ${esc(ASSETS[gain] ? ASSETS[gain].name : gain)}</span>`);
  if (spend) out.push(`<span class="fx neg">Spent · ${esc(ASSETS[spend] ? ASSETS[spend].name : spend)}</span>`);
  return out.length ? `<div class="fxlist">${out.join('')}</div>` : '';
}

/* ---------- main render ---------- */

let _scrollKey = '';
function render() {
  const root = $('app');
  if (VIEW === 'title') { root.innerHTML = renderTitle(); bind(); return; }
  if (VIEW === 'resume') { root.innerHTML = renderResume(); bind(); return; }
  if (VIEW === 'ending') { root.innerHTML = renderEnding(); window.scrollTo(0, 0); bind(); return; }

  let inner = '';
  if (TAB === 'desk') {
    if (LAST) inner = renderOutcome();
    else if (S.phase === 'brief') inner = renderBrief();
    else if (S.phase === 'alloc') inner = renderAlloc();
    else if (S.phase === 'scen') inner = renderScenario();
    else if (S.phase === 'review') inner = renderReviewPrompt();
    else if (S.phase === 'reviewshow') inner = renderReview();
    else if (S.phase === 'promote') inner = renderPromote();
    else if (S.phase === 'nextq') inner = renderNextPrompt();
    else if (S.phase === 'endgame') inner = renderEndgame();
    else if (S.phase === 'vote') inner = renderVote();
    if (!inner && S.over) { finish(); return; }
    if (!inner) { S.phase = 'nextq'; inner = renderNextPrompt(); }
  } else if (TAB === 'people') inner = renderPeople();
  else if (TAB === 'company') inner = renderCompany();
  else if (TAB === 'me') inner = renderMe();

  root.innerHTML = renderTop() + `<div class="main">${inner}</div>` + renderNav() + `<div class="toastwrap" id="toasts"></div>`;
  const hdr = root.querySelector('.header');
  if (hdr) document.documentElement.style.setProperty('--headerH', hdr.offsetHeight + 'px');
  const key = TAB + '|' + S.phase + '|' + S.quarter + '|' + S.scenIdx + '|' + (LAST ? 'o' : '') + '|' + (S.pending ? S.pending.id : '');
  if (key !== _scrollKey) { _scrollKey = key; window.scrollTo(0, 0); }
  bind();
}

/* ---------- toasts ---------- */

function toast(msg) {
  const w = $('toasts'); if (!w) return;
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

/* ---------- interaction ---------- */

function bind() {
  const root = $('app');

  root.onclick = (ev) => {
    const t = ev.target.closest('button');
    if (!t) return;

    // title screen
    if (t.dataset.diff) {
      CHOSEN_DIFF = t.dataset.diff;
      const nv = $('pname') ? $('pname').value : '';
      render();
      if ($('pname')) $('pname').value = nv;
      return;
    }
    if (t.dataset.bg) {
      CHOSEN_BG = t.dataset.bg;
      const nameVal = $('pname') ? $('pname').value : '';
      render();
      if ($('pname')) $('pname').value = nameVal;
      return;
    }
    if (t.id === 'start') {
      const nm = ($('pname') && $('pname').value.trim()) || 'A. Reyes';
      S = newGame(nm, CHOSEN_BG, Math.floor(Math.random() * 4294967295), CHOSEN_DIFF);
      BRIEF = startQuarter(S);
      S.phase = 'brief';
      VIEW = 'game'; TAB = 'desk'; LAST = null;
      render(); return;
    }
    if (t.id === 'again') { VIEW = 'title'; S = null; LAST = null; ENDING = null; VOTE = null; RESUMING = false; RESUME_ERR = ''; render(); return; }
    if (t.id === 'resumetoggle') { VIEW = 'resume'; RESUME_ERR = ''; render(); return; }
    if (t.id === 'resumeback') { VIEW = 'title'; RESUME_ERR = ''; render(); return; }
    if (t.id === 'doresume') {
      const box = $('resumebox');
      const raw = box ? box.value.trim() : '';
      if (!raw) { RESUME_ERR = 'Paste a save code first.'; render(); return; }
      const loaded = loadCode(raw);
      if (loaded === 'STALE') {
        RESUME_ERR = 'That code is from a different version of the game, so it cannot be restored safely.';
        render(); return;
      }
      if (!loaded) { RESUME_ERR = 'That code could not be read. Check nothing was cut off when you copied it.'; render(); return; }
      S = loaded; BRIEF = { market: S.market, memo: MARKET[S.market].memo, stock: S.stock };
      VIEW = 'game'; TAB = 'desk'; LAST = null; VOTE = null; ENDING = null; RESUME_ERR = '';
      render();
      toast('Resumed — Q' + S.qLabel + ' ' + S.year);
      return;
    }
    if (t.id === 'copycode') {
      const box = $('savecode');
      if (box) {
        box.select();
        const done = () => toast('Save code copied');
        if (navigator.clipboard) navigator.clipboard.writeText(box.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the code and copy it manually'); } });
        else { try { document.execCommand('copy'); done(); } catch (e) { toast('Select the code and copy it manually'); } }
      }
      return;
    }
    if (t.id === 'shareb') { copyResult(); return; }
    if (t.id === 'themebtn') { toggleTheme(); return; }

    // tabs
    if (t.dataset.tab) { TAB = t.dataset.tab; render(); return; }

    // outcome dismiss
    if (t.id === 'go' && LAST) {
      LAST = null;
      if (S.over) { finish(); return; }
      if (S.phase === 'scen') nextScenario(S);
      render(); return;
    }

    // brief → alloc
    if (t.id === 'go' && S.phase === 'brief') {
      S.phase = 'alloc';
      ALLOC = { execution: 0, relationships: 0, visibility: 0, recovery: 0 };
      render(); return;
    }

    // allocation
    if (t.dataset.alloc) {
      const id = t.dataset.alloc, d = parseInt(t.dataset.d, 10);
      const used = TRACKS.reduce((a, tr) => a + ALLOC[tr.id], 0);
      if (d > 0 && used >= focusPoints(S)) return;
      if (d < 0 && ALLOC[id] <= 0) return;
      ALLOC[id] += d;
      render(); return;
    }
    if (t.id === 'commit') {
      const used = TRACKS.reduce((a, tr) => a + ALLOC[tr.id], 0);
      if (used < focusPoints(S)) return;
      const d = applyAlloc(S, ALLOC);
      nextScenario(S);
      render();
      const bits = [];
      if (d.perf) bits.push(`Performance ${d.perf > 0 ? '+' : ''}${d.perf}`);
      if (d.burn) bits.push(`Burnout ${d.burn > 0 ? '+' : ''}${d.burn}`);
      if (bits.length) toast(bits.join('  ·  '));
      return;
    }

    // scenario choice
    if (t.dataset.choice !== undefined) {
      const i = parseInt(t.dataset.choice, 10);
      const sc = S.pending;
      LAST = applyChoice(S, sc, i);
      render();
      if (LAST.gain) toast('Gained: ' + ASSETS[LAST.gain].name);
      return;
    }

    // review
    if (t.id === 'dorev') { runReview(S); const v = S.phase; S._afterReview = v; S.phase = 'reviewshow'; render(); return; }
    if (t.id === 'go' && S.phase === 'reviewshow') {
      const v = S._afterReview;
      if (v === 'ending') { finish(); return; }
      if (v === 'promote') { promote(S); S.phase = 'promote'; render(); return; }
      if (v === 'endgame') { S.phase = 'endgame'; render(); return; }
      BRIEF = startQuarter(S); S.phase = 'brief'; render(); return;
    }
    if (t.id === 'go' && S.phase === 'promote') {
      BRIEF = startQuarter(S); S.phase = 'brief'; render(); return;
    }
    if (t.id === 'nextq') {
      BRIEF = startQuarter(S); S.phase = 'brief'; TAB = 'desk';
      render(); return;
    }

    // endgame
    if (t.dataset.eg !== undefined) {
      LAST = applyEndgameChoice(S, parseInt(t.dataset.eg, 10));
      render(); return;
    }
    if (t.id === 'go' && S.phase === 'vote' && VOTE) { finish(); return; }
  };

  // vote auto-compute when entering
  if (S && S.phase === 'vote' && !VOTE) { VOTE = finalVote(S); S.phase = 'vote'; render(); return; }

  const bgIn = $('pname');
  if (bgIn) bgIn.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const b = $('start'); if (b) b.click(); } };
}

function finish() {
  ENDING = pickEnding(S);
  VIEW = 'ending';
  render();
}

function copyResult() {
  const yrs = (S.quarter / 4).toFixed(1);
  const txt = `EXECUTIVE SUITE — ${S.name}
${ENDING.kicker}: ${ENDING.title}
${yrs} years at Meridian Dynamics · highest title ${role(S).short} · ${diffOf(S).name}
Credibility ${Math.round(S.cred)} · Integrity ${Math.round(S.integ)} · Total earned ${money(totalEarned(S))}`;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => alert('Result copied.'), () => alert(txt));
  else alert(txt);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
}

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', render);

</script>
</body>
</html>
